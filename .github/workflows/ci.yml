name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: TypeScript, lint, unit tests, strict JS coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run required JavaScript checks
        run: bash scripts/check-local.sh javascript

      - name: Preserve current-source coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 5

  android:
    name: Android tests, strict coverage, lint, unsigned Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/build.gradle
            android/settings.gradle
            android/app/build.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |-
            platforms;android-37
            build-tools;37.0.0
            ndk;27.1.12297006

      - name: Cache checksum-pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local-private/deps
          key: ${{ runner.os }}-android-native-${{ hashFiles('scripts/setup-native.py', 'native/CMakeLists.txt', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'package-lock.json') }}

      - name: Run Android checks and build
        run: bash scripts/check-local.sh android

      - name: Preserve Android test and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-and-reports
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve Android JaCoCo coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-coverage
          path: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 5

  ios:
    name: iOS tests and unsigned Release build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked iOS dependencies
        run: bash scripts/check-local.sh ios

      - name: Preserve unsigned iOS build output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-release
          path: ios/build/TranslatePDF.xcarchive
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve iOS native coverage inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-coverage
          path: |
            .local-private/build/ios-native-coverage/ios-native-coverage-llvm.json
            .local-private/build/ios-native-coverage/ios-xccov-report.json
            .local-private/build/ios-native-coverage/test.log
          if-no-files-found: ignore
          retention-days: 5

  native:
    name: PDFium native host tests
    runs-on: macos-26
    timeout-minutes: 90
    needs: [android, ios]
    if: always()
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up JDK headers for the JNI boundary tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache checksum-pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local-private/deps
          key: ${{ runner.os }}-host-native-${{ hashFiles('scripts/setup-native.py', 'native/CMakeLists.txt', 'package-lock.json') }}

      - name: Download iOS native coverage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-native-coverage
          path: .local-private/build/ios-native-coverage

      - name: Download Android native coverage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-native-coverage
          path: .local-private/build/android-native-coverage

      - name: Run C++ host integration and regression tests
        run: TRANSLATEPDF_JACOCO_XML=.local-private/build/android-native-coverage/jacocoTestReport.xml bash scripts/check-local.sh native

      - name: Preserve native host test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-host-reports
          path: .local-private/build/native-host/coverage/**
          if-no-files-found: ignore
          retention-days: 5

  security:
    name: Secret, dependency, workflow, and source scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        run: bash scripts/check-local.sh secrets

      - name: Scan locked dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-scanner-results.sarif
            ./

      - name: Audit GitHub Actions workflow
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/ci.yml
          version: 1.21.0
          online-audits: true
          advanced-security: 'false'
          annotations: 'true'

      - name: Preserve dependency scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan
          path: osv-scanner-results.sarif
          if-no-files-found: ignore
          retention-days: 5

  source-analysis:
    name: JavaScript and TypeScript source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          category: /language:javascript-typescript

  publication-screen:
    name: Changed-source publication and privacy screen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Screen the pushed change
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: bash scripts/check-local.sh publication
