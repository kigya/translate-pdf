apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "jacoco"
ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
apply plugin: "com.facebook.react"

jacoco {
    toolVersion = "0.8.15"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file([System.getenv("NODE_BINARY") ?: "node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = file("../../node_modules/expo/bin/cli")
    bundleCommand = "export:embed"
    nodeExecutableAndArgs = [System.getenv("NODE_BINARY") ?: "node"]
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    sourceSets.main.assets.srcDirs += file("../../assets")

    namespace "dev.kigya.translatepdf"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "dev.kigya.translatepdf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 500
        versionName "0.5.0"
        ndk { abiFilters "arm64-v8a" }
    }
    externalNativeBuild {
        cmake { path file("../../native/CMakeLists.txt") }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

def generatedLicenseAssets = layout.buildDirectory.dir("generated/assets/thirdPartyLicenses")
def licenseCatalog = new groovy.json.JsonSlurper().parse(file("../../licenses/catalog.json"))
def androidLicenseFiles = licenseCatalog.notices.findAll { it.platforms.contains("android") }
    .collectMany { it.files }.unique()
if (androidLicenseFiles.any { it.startsWith("/") || it.contains("\\") || it.split("/").any { part -> part == ".." } }) {
    throw new GradleException("Invalid license catalog path")
}
tasks.register("copyThirdPartyLicenses", Sync) {
    from(file("../../licenses"))
    include(androidLicenseFiles + ["catalog.json"])
    into(generatedLicenseAssets.map { it.dir("licenses") })
}
android.sourceSets.main.assets.srcDir(generatedLicenseAssets.get().asFile)
tasks.named("preBuild").configure { dependsOn(tasks.named("copyThirdPartyLicenses")) }

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    constraints {
        implementation("commons-io:commons-io:2.14.0") {
            because("Fixes GHSA-gwrp-pvrq-jmwv in the shipped document dependency graph")
        }
        implementation("com.google.code.gson:gson:2.8.9") {
            because("Fixes GHSA-4jrv-ppp4-jm57 in the shipped runtime graph")
        }
    }
    // Fresco's Android HTTP integration pulls vulnerable Okio 2.x transitively.
    // Keep the override narrow and use the compatible fixed JVM artifact pair.
    implementation("com.squareup.okio:okio:3.18.2") {
        because("Fixes GHSA-w33c-445m-f8w7 in the React Native/Fresco runtime graph")
    }
    implementation("com.squareup.okio:okio-jvm:3.18.2") {
        because("Pin the runtime implementation to the same patched Okio release")
    }
    implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")
    implementation("androidx.core:core-ktx:1.15.0")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.17")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test:core:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    jvmArgs("--add-exports=java.base/jdk.internal.access=ALL-UNNAMED")
    jacoco {
        // Robolectric's sandbox can define instrumented app classes without
        // normal CodeSource locations. Include those classes in the execution
        // data while excluding JDK internals from the owned-source report.
        includeNoLocationClasses = true
        excludes = ["jdk.internal.*"]
        if (providers.gradleProperty("collectDeviceCoverage").orElse("false").get().toBoolean()) {
            // These classes already contain the same JaCoCo probes from the
            // project-scoped offline transform. Avoid instrumenting them twice
            // in Robolectric; their probes still write to this test agent and
            // the original classes remain in coverageClassDirs below.
            excludes += ["dev.kigya.translatepdf.*", "com.translatepdf.*"]
        }
    }
}

def coverageClassDirs = files(
    fileTree("$buildDir/tmp/kotlin-classes/debug") {
        // Include every compiled production class from both app-owned packages.
        // Source-name globs silently omitted top-level classes declared beside
        // their primary class (for example NativeTesseractApi in OcrEngine.kt).
        // Keep exclusions explicit and limited to generated resources and the
        // debug-only device test hosts; nested and file-facade classes remain
        // part of the JaCoCo denominator.
        include "dev/kigya/translatepdf/**/*.class"
        include "com/translatepdf/**/*.class"
        exclude "**/BuildConfig.*", "**/R.class", '**/R$*.class', "**/Manifest*.*"
        exclude "dev/kigya/translatepdf/NativeSliceQaActivity*.class"
        exclude "dev/kigya/translatepdf/PreviewTestActivity*.class"
    }
)
def coverageExecutionData = files(layout.buildDirectory.file("jacoco/testDebugUnitTest.exec"))
def deviceCoveragePath = providers.environmentVariable("TRANSLATEPDF_ANDROID_DEVICE_COVERAGE").orNull
if (deviceCoveragePath != null) {
    def deviceCoverageFile = file(deviceCoveragePath)
    if (!deviceCoverageFile.isFile()) {
        throw new GradleException("The requested Android device coverage file is missing.")
    }
    coverageExecutionData += files(deviceCoverageFile)
}

// Scope the optional device probes to project classes. AGP's built-in transform
// also instruments vendors and overflows RadixColor's generated static initializer.
if (providers.gradleProperty("collectDeviceCoverage").orElse("false").get().toBoolean()) {
    apply from: file("../device-coverage.gradle")
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn tasks.named("testDebugUnitTest")
    executionData.from(coverageExecutionData)
    classDirectories.from(coverageClassDirs)
    sourceDirectories.from(files("src/main/java"))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register("jacocoTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn tasks.named("jacocoTestReport")
    executionData.from(coverageExecutionData)
    classDirectories.from(coverageClassDirs)
    violationRules {
        rule {
            element = "BUNDLE"
            limit {
                counter = "INSTRUCTION"
                value = "COVEREDRATIO"
                minimum = 1.0
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("jacocoTestCoverageVerification")
}
