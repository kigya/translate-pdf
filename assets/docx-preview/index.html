<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Match the default letter page width before docx-preview lays out text. -->
  <meta name="viewport" content="width=816, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Folivela document preview</title>
  <style>
    html, body, #document { margin: 0; background: white; color: black; width: max-content; min-width: 816px; -webkit-text-size-adjust: none; text-size-adjust: none; }
    .docx-wrapper { display: block !important; width: max-content !important; padding: 0 !important; background: white !important; align-items: flex-start !important; justify-content: flex-start !important; }
    .docx-wrapper > section.docx { box-shadow: none !important; margin: 0 !important; }
    section.docx { overflow: visible !important; }
    a { color: inherit; text-decoration: none; pointer-events: none; }
    @media print { .docx-wrapper { display: block !important; } }
  </style>
  <script src="jszip.min.js"></script>
  <script src="docx-preview.min.js"></script>
</head>
<body>
  <main id="document"></main>
  <script>
    'use strict';
    function notify(type) {
      if (window.FolivelaPreview) {
        if (type === 'ready') window.FolivelaPreview.ready();
        else window.FolivelaPreview.failed('The Word preview could not be prepared.');
      }
      if (window.webkit && window.webkit.messageHandlers.folivelaPreview) {
        window.webkit.messageHandlers.folivelaPreview.postMessage({ type: type });
      }
    }
    (async function () {
      try {
        const response = await fetch('document.docx');
        if (!response.ok) throw new Error('Document unavailable');
        await docx.renderAsync(await response.arrayBuffer(), document.getElementById('document'), null, {
          breakPages: true, ignoreLastRenderedPageBreak: false,
          renderAltChunks: false, renderComments: false, renderChanges: false,
          renderHeaders: true, renderFooters: true, renderFootnotes: true,
          renderEndnotes: true, useBase64URL: true, debug: false
        });
        document.querySelectorAll('a').forEach(function (link) { link.removeAttribute('href'); });
        await document.fonts.ready;
        await Promise.all(Array.from(document.images).map(function (image) {
          return image.complete ? Promise.resolve() : new Promise(function (resolve) {
            image.onload = image.onerror = resolve;
          });
        }));
        requestAnimationFrame(function () { requestAnimationFrame(function () { notify('ready'); }); });
      } catch (_) { notify('error'); }
    })();
  </script>
</body>
</html>
