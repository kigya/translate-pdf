buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Native libraries resolve React Native without relying on the GUI daemon's PATH.
ext.REACT_NATIVE_NODE_MODULES_DIR = file("../node_modules/react-native").absolutePath

gradle.projectsEvaluated {
    allprojects {
        tasks.withType(Exec).configureEach { task ->
            if (task.executable == "node" && System.getenv("NODE_BINARY")) {
                task.executable = System.getenv("NODE_BINARY")
            }
        }
    }
}
