pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}
def nodeBinary = System.getenv('NODE_BINARY') ?: 'node'
def reactNativeCli = new File(settingsDir, '../node_modules/@react-native-community/cli/build/bin.js').absolutePath
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand([nodeBinary, reactNativeCli, 'config'])
}
rootProject.name = 'TranslatePDF'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
